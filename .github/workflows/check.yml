name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * *"   # plugin releases happen in their own repos: re-check the newest tags daily
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test scripts
      - run: bun scripts/build.ts --check --remote
